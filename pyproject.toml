[project]
name = "pyreo"
version = "0.1.0"
description = "Write Python in te reo Māori"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

[project.scripts]
pyreo = "pyreo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyreo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = ["pytest>=8.0"]
